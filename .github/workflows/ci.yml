name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: noah
          POSTGRES_USER: noah_owner
          POSTGRES_PASSWORD: noah_owner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noah_owner -d noah"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://noah_app:noah_app@localhost:5432/noah
      DATABASE_MIGRATION_URL: postgresql://noah_owner:noah_owner@localhost:5432/noah
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Preparar base de datos de pruebas
        run: PGPASSWORD=noah_owner psql -h localhost -U noah_owner -d noah -f infra/local/init.sql
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Generar cliente Prisma y aplicar migraciones
        run: |
          pnpm --filter @noah/api db:generate
          DATABASE_URL="${DATABASE_MIGRATION_URL}" pnpm --filter @noah/api prisma migrate deploy
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
